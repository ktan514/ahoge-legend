name: Ahoge mesh verification

on:
  pull_request:
    paths: ['assets/characters/**', 'src/ui/ahoge_*', 'src/ui/fighter_visual.gd', 'tests/ahoge_mesh*', 'tools/ahoge_mesh/**', '.github/workflows/ahoge-mesh-tests.yml']
  push:
    paths: ['assets/characters/**', 'src/ui/ahoge_*', 'src/ui/fighter_visual.gd', 'tests/ahoge_mesh*', 'tools/ahoge_mesh/**', '.github/workflows/ahoge-mesh-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahoge-mesh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 素材検証の依存を準備
        run: python -m pip install 'Pillow==11.3.0'
      - name: 現行素材の寸法と輪郭を記録
        run: |
          mkdir -p artifacts/ahoge-mesh
          touch artifacts/.gdignore
          python tools/ahoge_mesh/inspect_source.py
      - name: Godotと描画環境を準備
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import
        run: ./scripts/godot-import.sh
      - name: 素材import後の画素を診断
        run: ./scripts/godot-strict.sh --headless --path . --script res://tests/ahoge_mesh_source_diagnostic.gd
      - name: 通常Godot回帰試験
        run: ./scripts/godot-strict.sh --headless --path . --script res://tests/run_all.gd
      - name: 固定メッシュの幾何学検証
        run: ./scripts/godot-strict.sh --headless --path . --script res://tests/ahoge_mesh_geometry_test.gd
      - name: 補間全区間の面積と境界交差検証
        run: python tools/ahoge_mesh/verify_geometry.py
      - name: OpenGL実描画とSprite比較
        run: xvfb-run -a ./scripts/godot-strict.sh --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/ahoge_mesh_render_test.gd
      - name: 実時間の攻撃と割込みを描画
        run: xvfb-run -a ./scripts/godot-strict.sh --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/ahoge_mesh_cycle_test.gd
      - name: 描画検証資料を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoge-mesh-verification
          path: artifacts/ahoge-mesh/
          if-no-files-found: error
          retention-days: 7
