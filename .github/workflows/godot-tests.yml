name: Godot tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3             -o godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Check prototype visual script
        run: godot --headless --path . --check-only --script res://src/ui/ahoge_prototype_rig.gd

      - name: Import Godot project
        run: ./scripts/godot-import.sh

      - name: Load project
        run: ./scripts/godot-strict.sh --headless --path . --quit

      - name: Run tests
        run: ./scripts/godot-strict.sh --headless --path . --script res://tests/run_all.gd
