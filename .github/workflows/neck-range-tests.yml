name: Neck range tests

on:
  pull_request:
    paths:
      - 'src/ui/**'
      - 'assets/characters/**'
      - 'tools/motion_preview/**'
      - 'tests/neck_range_test.gd'
      - '.github/workflows/neck-range-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neck-range-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Godotを準備
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot* /usr/local/bin/godot
      - name: 素材を読み込む
        run: ./scripts/godot-import.sh
      - name: 首の半直径移動とUIを検査
        run: timeout 90s ./scripts/godot-strict.sh --headless --path . --script res://tests/neck_range_test.gd -- --neck-test
      - name: 首の両端と基準位置を実描画する
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 90s xvfb-run -a ./scripts/godot-strict.sh --path . --audio-driver Dummy --script res://tests/neck_range_test.gd -- --neck-test
      - name: 正式アホ毛へ差し替えた待機姿勢を実描画する
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 90s xvfb-run -a ./scripts/godot-strict.sh --path . --audio-driver Dummy --script res://tests/sakuramiko_preview_capture.gd -- --capture
      - name: 首の確認資料を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neck-range
          path: artifacts/neck-range/
          if-no-files-found: error
          retention-days: 7
