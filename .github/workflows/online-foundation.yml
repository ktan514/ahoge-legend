      - "tests/hit_count_smoke.gd"
      - "tests/round_timer_smoke.gd"
      - "tests/hit_limit_smoke.gd"
      - "tests/timeout_winner_smoke.gd"
      - "tests/timeout_draw_smoke.gd"
      - "tests/round_result_smoke.gd"
      - "tests/bo3_smoke.gd"
      - "tests/match_result_smoke.gd"
      - ".github/workflows/online-foundation.yml"

concurrency:
  group: online-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["foundation","combat","round","match"]' || '["foundation","combat","round","match","long"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start local online foundation
        run: docker compose up --build -d

      - name: Wait for Nakama and RPC
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if ./scripts/server-health.sh; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import Godot project once
        shell: bash
        run: |
          ./scripts/godot-import.sh
          echo "AHOGE_GODOT_IMPORTED=1" >> "$GITHUB_ENV"

      - name: Godot client authentication smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-online-smoke.sh

      - name: Godot realtime socket smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-realtime-smoke.sh

      - name: Godot monthly season smoke
        if: matrix.group == 'foundation'
        run: bash ./scripts/client-season-smoke.sh

      - name: Godot Friend Match 2-client smoke
        if: matrix.group == 'foundation'
        run: bash ./scripts/client-friend-match-smoke.sh

      - name: Godot ranked matchmaker smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-matchmaker-smoke.sh

      - name: Godot authoritative combat input smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-combat-input-smoke.sh

      - name: Godot authoritative attack state smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-attack-state-smoke.sh

      - name: Godot authoritative Defense state smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-defense-state-smoke.sh

      - name: Godot authoritative Defense result smoke
        if: matrix.group == 'foundation'
        run: ./scripts/client-defense-result-smoke.sh

      - name: Verify restart with persistent volume
        if: matrix.group == 'foundation'
        shell: bash
        run: |
          docker compose restart postgres nakama

          for attempt in $(seq 1 30); do
            if ./scripts/server-health.sh; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Godot authoritative Contact outcome smoke
        if: matrix.group == 'combat'
        run: ./scripts/client-contact-outcome-smoke.sh

      - name: Godot authoritative Stagger smoke
        if: matrix.group == 'combat'
        run: ./scripts/client-stagger-smoke.sh

      - name: Godot authoritative SHORT state smoke
        if: matrix.group == 'combat'
        run: ./scripts/client-short-state-smoke.sh

      - name: Godot 2-client combat integration smoke
        if: matrix.group == 'combat'
        run: ./scripts/client-combat-integration-smoke.sh

      - name: Godot authoritative Hit count smoke
        if: matrix.group == 'combat'
        run: ./scripts/client-hit-count-smoke.sh

      - name: Godot auto reconnect smoke
        if: matrix.group == 'round'
        run: bash ./scripts/client-auto-reconnect-smoke.sh

      - name: Godot saved match resume smoke
        if: matrix.group == 'round'
        run: bash ./scripts/client-saved-match-resume-smoke.sh

      - name: Godot reconnect continuity smoke
        if: matrix.group == 'round'
        run: bash ./scripts/client-reconnect-smoke.sh

      - name: Godot reconnect timeout smoke
        if: matrix.group == 'round'
        run: bash ./scripts/client-reconnect-timeout-smoke.sh

      - name: Godot stale lock repair smoke
        if: matrix.group == 'round'
        run: bash ./scripts/client-lock-repair-smoke.sh

      - name: Godot authoritative 5 Hit round win smoke
        if: matrix.group == 'round'
        run: ./scripts/client-hit-limit-smoke.sh

      - name: Godot authoritative Round Result smoke
        if: matrix.group == 'round'
        run: ./scripts/client-round-result-smoke.sh

      - name: Godot M1 authoritative Battle UI smoke
        if: matrix.group == 'round'
        run: ./scripts/client-m1-battle-smoke.sh

      - name: Godot authoritative BO3 full match smoke
        if: matrix.group == 'match'
        run: ./scripts/client-bo3-smoke.sh

      - name: Godot authoritative Match Result smoke
        if: matrix.group == 'match'
        run: ./scripts/client-match-result-smoke.sh

      - name: Godot Ranked major GameFlow smoke
        if: matrix.group == 'match'
        run: bash ./scripts/client-ranked-gameflow-smoke.sh

      - name: Godot authoritative 85 second timer smoke
        if: matrix.group == 'long'
        run: ./scripts/client-round-timer-smoke.sh

      - name: Godot authoritative timeout winner smoke
        if: matrix.group == 'long'
        run: ./scripts/client-timeout-winner-smoke.sh

      - name: Seed unequal Player Rating for Draw smoke
        if: matrix.group == 'long'
        env:
          AHOGE_DEVICE_ID_OVERRIDE: ahoge-draw-seed-p1
          AHOGE_TEST_SECOND_DEVICE_ID: ahoge-draw-seed-p2
        run: ./scripts/client-match-result-smoke.sh

      - name: Godot authoritative timeout Draw smoke
        if: matrix.group == 'long'
        env:
          AHOGE_DEVICE_ID_OVERRIDE: ahoge-draw-seed-p1
          AHOGE_TEST_SECOND_DEVICE_ID: ahoge-draw-seed-p2
        run: ./scripts/client-timeout-draw-smoke.sh

      - name: Shutdown
        if: always()
        run: docker compose down -v
