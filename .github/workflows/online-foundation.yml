name: Online foundation

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "server/nakama/**"
      - "scripts/server-*.sh"
      - "scripts/client-online-smoke.sh"
      - "scripts/client-realtime-smoke.sh"
      - "scripts/client-matchmaker-smoke.sh"
      - "scripts/client-combat-input-smoke.sh"
      - "scripts/client-attack-state-smoke.sh"
      - "scripts/client-defense-state-smoke.sh"
      - "scripts/client-defense-result-smoke.sh"
      - "scripts/client-contact-outcome-smoke.sh"
      - "scripts/client-stagger-smoke.sh"
      - "scripts/client-short-state-smoke.sh"
      - "scripts/client-combat-integration-smoke.sh"
      - "scripts/client-hit-count-smoke.sh"
      - "scripts/client-round-timer-smoke.sh"
      - "scripts/client-hit-limit-smoke.sh"
      - "scripts/client-timeout-winner-smoke.sh"
      - "scripts/client-overtime-smoke.sh"
      - "scripts/client-round-result-smoke.sh"
      - "scripts/godot-import.sh"
      - "scripts/godot-strict.sh"
      - "addons/com.heroiclabs.nakama/**"
      - "src/online/**"
      - "src/config/online_config.gd"
      - "tests/online_smoke.gd"
      - "tests/realtime_smoke.gd"
      - "tests/matchmaker_smoke.gd"
      - "tests/combat_input_smoke.gd"
      - "tests/attack_state_smoke.gd"
      - "tests/defense_state_smoke.gd"
      - "tests/defense_result_smoke.gd"
      - "tests/contact_outcome_smoke.gd"
      - "tests/stagger_smoke.gd"
      - "tests/short_state_smoke.gd"
      - "tests/combat_integration_smoke.gd"
      - "tests/hit_count_smoke.gd"
      - "tests/round_timer_smoke.gd"
      - "tests/hit_limit_smoke.gd"
      - "tests/timeout_winner_smoke.gd"
      - "tests/overtime_smoke.gd"
      - "tests/round_result_smoke.gd"
      - ".github/workflows/online-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "server/nakama/**"
      - "scripts/server-*.sh"
      - "scripts/client-online-smoke.sh"
      - "scripts/client-realtime-smoke.sh"
      - "scripts/client-matchmaker-smoke.sh"
      - "scripts/client-combat-input-smoke.sh"
      - "scripts/client-attack-state-smoke.sh"
      - "scripts/client-defense-state-smoke.sh"
      - "scripts/client-defense-result-smoke.sh"
      - "scripts/client-contact-outcome-smoke.sh"
      - "scripts/client-stagger-smoke.sh"
      - "scripts/client-short-state-smoke.sh"
      - "scripts/client-combat-integration-smoke.sh"
      - "scripts/client-hit-count-smoke.sh"
      - "scripts/client-round-timer-smoke.sh"
      - "scripts/client-hit-limit-smoke.sh"
      - "scripts/client-timeout-winner-smoke.sh"
      - "scripts/client-overtime-smoke.sh"
      - "scripts/client-round-result-smoke.sh"
      - "scripts/godot-import.sh"
      - "scripts/godot-strict.sh"
      - "addons/com.heroiclabs.nakama/**"
      - "src/online/**"
      - "src/config/online_config.gd"
      - "tests/online_smoke.gd"
      - "tests/realtime_smoke.gd"
      - "tests/matchmaker_smoke.gd"
      - "tests/combat_input_smoke.gd"
      - "tests/attack_state_smoke.gd"
      - "tests/defense_state_smoke.gd"
      - "tests/defense_result_smoke.gd"
      - "tests/contact_outcome_smoke.gd"
      - "tests/stagger_smoke.gd"
      - "tests/short_state_smoke.gd"
      - "tests/combat_integration_smoke.gd"
      - "tests/hit_count_smoke.gd"
      - "tests/round_timer_smoke.gd"
      - "tests/hit_limit_smoke.gd"
      - "tests/timeout_winner_smoke.gd"
      - "tests/overtime_smoke.gd"
      - "tests/round_result_smoke.gd"
      - ".github/workflows/online-foundation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript type-check and build
        working-directory: server/nakama
        run: |
          npm install
          npm run type-check
          npm run build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start local online foundation
        run: docker compose up --build -d

      - name: Wait for Nakama and RPC
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if ./scripts/server-health.sh; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3             -o godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Godot client authentication smoke
        run: ./scripts/client-online-smoke.sh

      - name: Godot realtime socket smoke
        run: ./scripts/client-realtime-smoke.sh

      - name: Godot ranked matchmaker smoke
        run: ./scripts/client-matchmaker-smoke.sh

      - name: Godot authoritative combat input smoke
        run: ./scripts/client-combat-input-smoke.sh

      - name: Godot authoritative attack state smoke
        run: ./scripts/client-attack-state-smoke.sh

      - name: Godot authoritative Defense state smoke
        run: ./scripts/client-defense-state-smoke.sh

      - name: Godot authoritative Defense result smoke
        run: ./scripts/client-defense-result-smoke.sh

      - name: Godot authoritative Contact outcome smoke
        run: ./scripts/client-contact-outcome-smoke.sh

      - name: Godot authoritative Stagger smoke
        run: ./scripts/client-stagger-smoke.sh

      - name: Godot authoritative SHORT state smoke
        run: ./scripts/client-short-state-smoke.sh

      - name: Godot 2-client combat integration smoke
        run: ./scripts/client-combat-integration-smoke.sh

      - name: Godot authoritative Hit count smoke
        run: ./scripts/client-hit-count-smoke.sh

      - name: Godot authoritative 85 second timer smoke
        run: ./scripts/client-round-timer-smoke.sh

      - name: Godot authoritative 5 Hit round win smoke
        run: ./scripts/client-hit-limit-smoke.sh

      - name: Godot authoritative timeout winner smoke
        run: ./scripts/client-timeout-winner-smoke.sh

      - name: Godot authoritative Overtime smoke
        run: ./scripts/client-overtime-smoke.sh

      - name: Godot authoritative Round Result smoke
        run: ./scripts/client-round-result-smoke.sh

      - name: Verify restart with persistent volume
        shell: bash
        run: |
          docker compose restart postgres nakama

          for attempt in $(seq 1 30); do
            if ./scripts/server-health.sh; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Shutdown
        if: always()
        run: docker compose down -v
